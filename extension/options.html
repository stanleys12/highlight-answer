<!doctype html>
<html><head><meta charset="utf-8"><title>Highlight Answer</title>
<style>
  body{font:14px/1.5 -apple-system,system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#222}
  label{display:block;margin:14px 0 4px;font-weight:600}
  textarea{width:100%;min-height:140px;font:inherit;padding:8px;box-sizing:border-box}
  select{font:inherit;padding:4px}
  small{color:#666}#saved{color:#2a7;margin-left:8px}
</style></head><body>
<h2>Highlight Answer</h2>
<label><input type="checkbox" id="enabled"> On (the toolbar button also toggles this)</label>
<label for="model">Model</label>
<select id="model"><option value="haiku">Haiku — fastest, cheapest</option><option value="sonnet">Sonnet — balanced (default)</option><option value="opus">Opus — most accurate, slowest</option></select>
<label for="aboutMe">About me <small>(optional — only used for questions about you; leave empty to keep answers general)</small></label>
<textarea id="aboutMe" placeholder="Anything you want questions about you to be answered from."></textarea>
<p><button id="save">Save</button><span id="saved"></span></p>
<p><small>Answers come from the local helper on 127.0.0.1:8799 (run <code>~/highlight-answer/install.sh</code> once).</small></p>
<script src="options.js"></script>
</body></html>
