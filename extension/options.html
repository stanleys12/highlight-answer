<!doctype html>
<html><head><meta charset="utf-8"><title>Highlight Answer</title>
<style>
  body{font:14px/1.5 -apple-system,system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#222}
  label{display:block;margin:14px 0 4px;font-weight:600}
  textarea{width:100%;min-height:140px;font:inherit;padding:8px;box-sizing:border-box}
  select{font:inherit;padding:4px}
  small{color:#666}table{border-collapse:collapse;margin:6px 0 14px;font-size:13px}td,th{padding:3px 10px 3px 0;text-align:left}th{color:#666;font-weight:500}.big{font-size:20px;font-weight:600}#saved{color:#2a7;margin-left:8px}
</style></head><body>
<h2>Highlight Answer</h2>
<label><input type="checkbox" id="enabled"> On (the toolbar button also toggles this)</label>
<label for="mode">When I highlight a question</label>
<select id="mode"><option value="button">Show a small Answer button (default — never gets in the way of copying)</option><option value="auto">Answer automatically</option></select>
<br><small>Either way, holding Option (⌥) while highlighting answers immediately.</small>
<label for="model">Model</label>
<select id="model"><option value="opus">Opus — most accurate (default)</option><option value="sonnet">Sonnet — faster, cheaper</option><option value="haiku">Haiku — fastest, cheapest, weakest on hard questions</option></select>
<label><input type="checkbox" id="think"> Think before answering <small>(slower, much better on hard questions)</small></label>
<label><input type="checkbox" id="speculate"> Start answering as soon as the Answer button appears <small>(the answer is often ready by the time you click; costs a little for question-like highlights you don't click)</small></label>
<label for="aboutMe">About me <small>(optional — only used for questions about you; leave empty to keep answers general)</small></label>
<textarea id="aboutMe" placeholder="Anything you want questions about you to be answered from."></textarea>
<p><button id="save">Save</button><span id="saved"></span></p>
<h3 style="margin-top:28px">Performance <small>(last <select id="days"><option>1</option><option selected>7</option><option>30</option></select> days)</small></h3>
<div id="stats"><small>loading…</small></div>
<p><small>Answers come from the local helper on 127.0.0.1:8799 (run <code>~/highlight-answer/install.sh</code> once).</small></p>
<script src="options.js"></script>
</body></html>
