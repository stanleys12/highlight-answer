<!doctype html>
<html><head><meta charset="utf-8"><title>Highlight Answer</title>
<style>
  body{font:13px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:12px;width:270px;background:#1e222b;color:#eceff4}
  h1{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
  .p{display:block;width:100%;text-align:left;background:#262b36;border:1px solid #3b4252;border-radius:8px;padding:8px 10px;margin:0 0 6px;color:inherit;font:inherit;cursor:pointer}
  .p:hover{border-color:#5e81ac}.p.on{border-color:#88c0d0;background:#2b3442}
  .p b{display:block;font-size:13.5px}.p span{color:#9aa3b2;font-size:12px}
  .sw{display:flex;align-items:center;gap:6px;font-weight:400;font-size:12px;color:#9aa3b2;cursor:pointer}
  .foot{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:#9aa3b2}a{color:#88c0d0;text-decoration:none}
</style></head><body>
<h1>Highlight Answer <label class="sw"><input type="checkbox" id="enabled"> on</label></h1>
<button class="p" data-p="fast"><b>⚡ Fast</b><span>Quick answer only · ~0.5 s · Haiku</span></button>
<button class="p" data-p="balanced"><b>⚖️ Balanced</b><span>Quick answer, then double-checked (✓ or corrected) · ~0.5 s / ~2 s</span></button>
<button class="p" data-p="accurate"><b>🎯 Accurate</b><span>No quick guess — only Opus with thinking · ~3 s, longer on hard ones</span></button>
<div class="foot"><span>Cycle: <span id="key">⌥⇧A</span></span><a href="#" id="opts">More settings</a></div>
<script src="popup.js"></script>
</body></html>
